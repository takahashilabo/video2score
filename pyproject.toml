[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video2score"
version = "0.1.0"
description = "ピアノ演奏動画から両手ピアノ譜（大譜表PDF）を生成するツール"
requires-python = ">=3.11"
dependencies = [
    "basic-pitch>=0.4.0",
    "cairosvg>=2.9.0",
    "librosa>=0.11.0",
    "mediapipe>=0.10.20",
    "mido>=1.3.3",
    "music21>=9.1.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "scipy>=1.11.0",
    "setuptools<81",
    "soundfile>=0.12.0",
    "verovio>=4.0.0",
    "yt-dlp>=2024.1.0",
]

[project.optional-dependencies]
piano = [
    "torch>=2.0",
    "piano-transcription-inference>=0.0.6",
]

[project.scripts]
video2score = "video2score:main"
